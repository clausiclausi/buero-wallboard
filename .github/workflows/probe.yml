name: probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Buero-Wallboard/1.38 (Kiosk-Anzeige; github.com/clausiclausi/buero-wallboard)"
          curl -sS -A "$UA" "https://en.wikipedia.org/w/api.php?action=parse&page=2026_United_States_House_of_Representatives_elections&prop=wikitext&format=json&formatversion=2" -o w.json
          python3 -c "
          import json,re;t=json.load(open('w.json'))['parse']['wikitext']
          i=t.find('==Alabama==');print(t[i:i+3500])
          print('USHR', len(re.findall(r'\{\{ushr',t)), re.findall(r'\{\{ushr[^}]*\}\}',t)[:15])
          j=t.find('Georgia', t.find('==Georgia=='));print(t[j:j+200])
          "
          curl -sS -A "$UA" "https://en.wikipedia.org/w/api.php?action=parse&page=2026_United_States_Senate_elections&prop=wikitext&format=json&formatversion=2" -o s.json
          python3 -c "
          import json;t=json.load(open('s.json'))['parse']['wikitext']
          i=t.find('[[2026 United States Senate election in Georgia|Georgia]]', t.find('Elections leading'));print(t[i:i+1800])"

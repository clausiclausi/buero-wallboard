name: probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          mkdir -p /tmp/d && node -e "
          const E = require('./app/election.js')({ DATA: '/tmp/d', log: console.log, getSettings: () => ({ election: true }), broadcast() {} });
          E.start();
          setTimeout(() => { const s = E.view(); const sum = r => r && r.races ? r.races.map(x => x.label + ':' + (x.winner||'-') + '/' + (x.leader||'-') + ' ' + x.cands.map(c => c.name + '(' + c.party + ')' + (c.pct ?? '')).join(', ')).join(' | ') : '';
            console.log('ERROR', s.error); console.log('UPDATED', s.updated);
            console.log('SENATE', JSON.stringify({ total: s.senate?.total, won: s.senate?.won, lead: s.senate?.lead, decided: s.senate?.decided, n: s.senate?.races.length }));
            console.log(sum(s.senate));
            console.log('HOUSE', JSON.stringify({ total: s.house?.total, won: s.house?.won, lead: s.house?.lead, decided: s.house?.decided, n: s.house?.count, states: Object.keys(s.house?.states || {}).length }));
            console.log('HOUSE close', (s.house?.close || []).length);
            console.log('GOV', JSON.stringify({ won: s.gov?.won, decided: s.gov?.decided, n: s.gov?.races.length }));
            console.log(sum(s.gov));
            console.log('NEWS', JSON.stringify(s.news.map(n => n.src + ' ' + n.title)));
            process.exit(0); }, 25000);
          "

name: wettertest
on: push
jobs:
  win:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.12.0' }
      - run: node .github/t/ca.js
        continue-on-error: true
      - shell: pwsh
        continue-on-error: true
        run: |
          '{"port":18080,"externalPort":18081,"pin":"1234","proxy":"http://127.0.0.1:9"}' | Set-Content config.json
          $p = Start-Process node -ArgumentList 'app/server.js' -RedirectStandardOutput log.txt -PassThru
          Start-Sleep 25
          try { $d = Invoke-RestMethod http://localhost:18080/api/diag -TimeoutSec 200; $d.results | Select-Object -First 5 | ForEach-Object { "RES DIAG $($_.ok) | $($_.name) | $($_.detail)" } } catch { "RES diag fail $_" }
          Get-Content log.txt | Select-String 'Netz|Error' | ForEach-Object { "RES LOG $_" }
          Stop-Process -Id $p.Id
          exit 0
